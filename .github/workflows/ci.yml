name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.toolchain }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # GNU é o toolchain usado nas releases; MSVC garante que compila com o compilador da Microsoft também.
        toolchain: [stable-x86_64-pc-windows-gnu, stable-x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Rust
        shell: bash
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy,rustfmt
          rustup default ${{ matrix.toolchain }}
          rustc -Vv

      - name: Formatação
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Testes
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Smoke test
        shell: pwsh
        run: ./.github/scripts/smoke-test.ps1 target/release/risemode-temp.exe

      - uses: actions/upload-artifact@v7
        with:
          name: risemode-temp-${{ matrix.toolchain }}
          path: target/release/risemode-temp.exe
          retention-days: 14
