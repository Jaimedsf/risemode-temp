# Publica uma Release quando a versão do Cargo.toml na main ainda não tem tag.
#
# A versão muda por PR (a main é protegida):
#   - Actions → "Preparar release" → Run workflow abre o PR do bump; ou
#   - mude `version` no Cargo.toml (e o Cargo.lock) num PR seu.
# O merge do PR dispara este workflow. "Run workflow" aqui só republica uma versão que ficou sem tag.
name: Release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write      # tag e Release
  id-token: write      # atestado de proveniência
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  TOOLCHAIN: stable-x86_64-pc-windows-gnu

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags, para saber se a versão já foi publicada

      - name: Instalar Rust
        shell: bash
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy
          rustup default "$TOOLCHAIN"
          rustc -Vv

      - name: Definir versão
        id: ver
        shell: bash
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if git rev-parse -q --verify "refs/tags/v$v" > /dev/null; then
            echo "::notice::v$v já foi publicada; nada a fazer."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          [[ "$v" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Clippy e testes
        if: steps.ver.outputs.publish == 'true'
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Build release
        if: steps.ver.outputs.publish == 'true'
        run: cargo build --release --locked

      - name: Smoke test
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        run: ./.github/scripts/smoke-test.ps1 target/release/risemode-temp.exe

      - name: Empacotar
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        run: ./.github/scripts/package.ps1 -Exe target/release/risemode-temp.exe -Version ${{ steps.ver.outputs.version }} -OutDir dist

      - name: Atestado de proveniência
        if: steps.ver.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/risemode-temp.exe
            dist/risemode-temp-v${{ steps.ver.outputs.version }}-windows-x64.zip

      - name: Publicar Release
        if: steps.ver.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          flags=()
          [ "${{ steps.ver.outputs.prerelease }}" = true ] && flags+=(--prerelease)
          gh release create "v$V" \
            --target "$(git rev-parse HEAD)" \
            --title "risemode-temp v$V" \
            --notes-file dist/release-notes.md \
            --generate-notes \
            "${flags[@]}" \
            "dist/risemode-temp-v$V-windows-x64.zip" \
            dist/risemode-temp.exe \
            dist/SHA256SUMS.txt
